<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} — Product Dossier — Jam Tracks Hub</title>
  <script>
    (() => {
      const key = "jam-tracks-hub-log-theme";
      try {
        const saved = localStorage.getItem(key);
        document.documentElement.dataset.theme = saved === "light" || saved === "dark"
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/dossier.css">
</head>
<body class="dossier-page" data-lang="en">
  {{BODY}}
  <script id="dossier-data" type="application/json">{{DOSSIER_DATA}}</script>
  <script src="../../assets/dossier.js" defer></script>
</body>
</html>
